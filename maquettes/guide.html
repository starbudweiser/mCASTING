<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Guide de configuration</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;background:#0b0b0d;color:#eee;-webkit-font-smoothing:antialiased}
.top{padding:18px 28px 6px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700}.top .s{color:#999}
.screens{display:flex;gap:6px;padding:8px 28px;flex-wrap:wrap}
.screens button,.seg button{background:#222;color:#eee;border:0;padding:8px 16px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.screens button.on{background:#555}
.tools{display:flex;align-items:center;gap:14px;padding:4px 28px 12px;color:#aaa;flex-wrap:wrap}
.seg{display:inline-flex;background:#222;border-radius:999px;padding:3px}.seg button{padding:4px 14px}.seg button.on{background:#444}
.legend{color:#aaa;padding:0 28px 12px;max-width:1240px;line-height:1.55}
.stage{padding:6px 28px 40px;overflow:auto}

.win{width:1200px;height:760px;display:grid;grid-template-rows:auto 1fr;overflow:hidden;background:var(--bg);color:var(--t);border-radius:12px;box-shadow:var(--sh)}
.bar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:var(--bd)}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.brand{font-weight:700;font-size:15px;margin-left:8px}.m{color:var(--m)}
.bar .r{margin-left:auto;color:var(--t2);font-size:12px}
.body{display:grid;grid-template-columns:230px 1fr;min-height:0}
.steps{padding:18px 12px;border-right:var(--bd);display:flex;flex-direction:column;gap:3px}
.steps .h{padding:0 10px 8px}
.st{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--t2)}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--ctl);color:var(--t2);flex:none}
.st.done b{background:var(--ok);color:#fff}.st.on{background:var(--ctl);color:var(--t);font-weight:600}.st.on b{background:var(--acc);color:var(--onacc)}
.steps .note{margin-top:auto}
.main{display:flex;flex-direction:column;min-height:0}
.content{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:14px;overflow:hidden;min-height:0}
.title{font-size:20px;font-weight:700}.lead{color:var(--t2);max-width:760px;margin-top:3px}
.nav{display:flex;gap:10px;align-items:center;padding:12px 26px;border-top:var(--bd)}
.nav .sp{flex:1}.nav .dots{color:var(--t2);font-size:12px}
.h{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t2)}
.btn{background:var(--ctl);color:var(--t);border:0;padding:7px 14px;border-radius:8px;font:inherit;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--acc);color:var(--onacc)}.btn.go{background:var(--ok);color:#fff}.btn.sm{padding:4px 10px;font-size:11.5px}.btn.ghost{background:none;color:var(--t2)}
.box{background:var(--card);border:var(--bd);border-radius:12px;padding:14px}
.box.sel{outline:2px solid var(--acc)}.box.ok{outline:2px solid var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tag{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ctl);color:var(--t2);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.tag.no{opacity:.55;text-decoration:line-through}
.tag.acc{background:var(--acc);color:var(--onacc)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.sub{color:var(--t2);font-size:11.5px}
.big{font-size:24px;font-weight:700;line-height:1.1}
.field{display:flex;flex-direction:column;gap:5px}.field span{color:var(--t2);font-size:11.5px}
.inp{background:var(--ctl);border-radius:8px;padding:8px 11px}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:4px 11px;border-radius:999px;background:var(--ctl);font-size:12px}.chip.on{background:var(--acc);color:var(--onacc);font-weight:600}
.note{background:var(--ctl);border-radius:8px;padding:9px 12px;color:var(--t2);font-size:11.5px;line-height:1.5}
.note b{color:var(--t)}
.row{display:flex;gap:10px;align-items:center}.row .sp{flex:1}
.mod{display:grid;grid-template-columns:22px 1fr 260px 110px 120px;gap:14px;align-items:center;padding:11px 14px}
.ck{width:18px;height:18px;border-radius:5px;background:var(--ctl);display:grid;place-items:center;font-size:12px;font-weight:700}.ck.on{background:var(--acc);color:var(--onacc)}
.meter{height:6px;border-radius:99px;background:var(--ctl);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok)}.meter i.w{background:var(--warn)}
.play{width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-size:10px;flex:none}
.wave{display:flex;align-items:center;gap:1.5px;height:22px;flex:1}.wave i{display:block;width:2.5px;border-radius:2px;background:var(--t2);opacity:.6}
.tbl{display:grid;gap:0;border:var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.tbl>div{padding:10px 12px;border-bottom:var(--bd);border-right:var(--bd);display:flex;flex-direction:column;gap:6px;justify-content:center}
.tbl .hd{background:var(--ctl);font-weight:600}
.star{color:var(--warn);font-size:14px;letter-spacing:1px}
.drop{border:2px dashed var(--ctl);border-radius:12px;padding:22px;text-align:center;color:var(--t2);display:flex;flex-direction:column;gap:6px;align-items:center}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:var(--onacc);background:var(--acc);font-size:12px;flex:none}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border:var(--bd);border-radius:10px}
.win .seg{flex:none}.win .seg button{white-space:nowrap;padding:5px 12px}
.flow{display:flex;align-items:stretch;gap:8px}.flow i{align-self:center;color:var(--t2);font-style:normal}
.fb{flex:1;background:var(--card);border:var(--bd);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}.fb span{color:var(--t2);font-size:11.5px}.fb.on{outline:2px solid var(--acc)}
.seg3{display:inline-flex;background:var(--ctl);border-radius:999px;padding:3px;flex:none}.seg3 b{padding:5px 12px;border-radius:999px;font-weight:500;white-space:nowrap}.seg3 b.on{background:var(--acc);color:var(--onacc)}
.pbar{height:8px;border-radius:99px;background:var(--ctl);overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}

[data-th=clair]{--bg:#f4f1ec;--card:#fff;--ctl:#ebe6de;--t:#26231e;--t2:#7b756a;--acc:#26231e;--onacc:#f4f1ec;--m:#d9622b;--ok:#3f8f5a;--warn:#b7791f;--sh:0 18px 50px rgba(60,40,10,.18);--bd:1px solid #e3ddd2}
[data-th=sombre]{--bg:#131316;--card:#232327;--ctl:#2c2c31;--t:#f5f5f7;--t2:#98989f;--acc:#0a84ff;--onacc:#fff;--m:#f08a52;--ok:#30d158;--warn:#ff9f0a;--sh:0 18px 50px rgba(0,0,0,.5);--bd:1px solid #303035}
</style></head><body>
<div class="top"><h1><span style="color:#d9622b">m</span>CASTING — Guide de configuration</h1><span class="s">Maquettes · Flat Mat · version simple, 7 étapes</span></div>
<nav class="screens" id="screens"></nav>
<div class="tools"><span class="seg" id="seg"><button data-th="clair" class="on">Clair</button><button data-th="sombre">Sombre</button></span></div>
<p class="legend" id="legend"></p>
<div class="stage"><div id="win" class="win" data-th="clair"></div></div>
<script>
const STEPS=['Projet','Préparation','Dialogues','Voix','Écoute','Créatures','Bibliothèque'];
const W=n=>'<span class="wave">'+Array.from({length:n},(_,i)=>`<i style="height:${4+Math.abs(Math.sin(i*1.7)*16)}px"></i>`).join('')+'</span>';
const LEG=[
"Une seule question à la fois, des choix déjà faits pour vous. « Plus tard » ferme le guide ; il se reprend depuis le menu Aide.",
"Facultatif. L'IA que vous utilisez déjà peut préparer le projet à votre place. Les détails techniques (skill, serveur MCP) sont installés sans qu'on vous les montre.",
"Facultatif. Un fichier de répliques suffit ; mCASTING comprend seul qui est qui.",
"Le choix recommandé est déjà fait. Les deux autres possibilités restent visibles, repliées. Le Mac est vérifié sans rien vous demander.",
"On écoute, on choisit. Le téléchargement se fait pendant ce temps.",
"N'apparaît que si le projet contient des créatures ou des animaux. Un choix par personnage, à l'oreille.",
"Un bouton. La durée est annoncée, la génération continue en arrière-plan."];
const nav=(i,next,skip)=>`<div class="nav"><button class="btn ghost">Plus tard</button><span class="sp"></span>${skip?`<button class="btn ghost">${skip}</button>`:''}<span class="dots">${i+1} / 7</span>${i?'<button class="btn">← Retour</button>':''}<button class="btn pri">${next} →</button></div>`;
const shell=(i,html,next,skip)=>`<div class="bar"><span class="lights"><i></i><i></i><i></i></span><span class="brand"><span class="m">m</span>CASTING</span><span class="r">Premiers pas</span></div>
<div class="body"><aside class="steps">${STEPS.map((s,k)=>`<div class="st ${k<i?'done':k==i?'on':''}"><b>${k<i?'✓':k+1}</b>${s}</div>`).join('')}</aside>
<div class="main"><div class="content">${html}</div>${nav(i,next,skip)}</div></div>`;
const Q=(t,l)=>`<div><div class="title" style="font-size:24px">${t}</div><div class="lead" style="font-size:14px;margin-top:6px">${l}</div></div>`;
const card=(on,ic,t,d,extra='')=>`<div class="box ${on?'sel':''}" style="display:flex;gap:14px;align-items:flex-start;padding:16px"><span class="ck ${on?'on':''}" style="border-radius:50%;width:20px;height:20px;margin-top:2px">${on?'✓':''}</span><div style="flex:1"><div class="row" style="gap:8px"><span style="font-size:18px">${ic}</span><b style="font-size:15px">${t}</b></div><div class="sub" style="font-size:12.5px;margin-top:4px">${d}</div>${extra}</div></div>`;

const S=[
// 1 Projet
()=>shell(0,`${Q('Comment s\'appelle votre projet ?','On lui donne un nom et un dossier. Le résultat du casting y sera enregistré.')}
<div class="box" style="display:flex;flex-direction:column;gap:14px;padding:18px;max-width:720px">
<div class="field"><span>Nom</span><div class="inp" style="font-size:14px">Le Château du Point & Click</div></div>
<div class="field"><span>Dossier</span><div class="row"><div class="inp" style="flex:1">pointclick</div><button class="btn sm">Choisir…</button></div></div>
<div class="field"><span>Langues des voix</span><div class="chips"><span class="chip on">Français</span><span class="chip on">Anglais</span><span class="chip">Espagnol</span><span class="chip">Italien</span></div></div></div>
<div class="row" style="gap:16px"><button class="btn sm ghost">Ouvrir un projet existant</button><button class="btn sm ghost">Importer un fichier de projet</button></div>`,'Continuer'),

// 2 Préparation (assistant IA)
()=>shell(1,`${Q('Voulez-vous qu\'une IA prépare votre projet ?','Elle lit vos textes, décrit chaque personnage et sa voix, et prépare les répliques. Vous pouvez aussi tout faire vous-même.')}
<div style="display:flex;flex-direction:column;gap:10px;max-width:760px">
${card(1,'💬','Oui, avec l\'IA que j\'utilise déjà','Claude, ChatGPT, Cursor… détectés sur ce Mac. mCASTING leur apprend à préparer un casting.','<div class="row" style="margin-top:10px;gap:6px"><span class="tag ok">Claude ✓</span><span class="tag ok">ChatGPT ✓</span><span class="tag">Cursor</span></div>')}
${card(0,'🔒','Oui, avec une IA installée sur ce Mac','Gratuite et privée : rien ne sort de votre ordinateur. Ollama est déjà installé.')}
${card(0,'✍️','Non, je décris mes personnages moi-même','Vous pourrez changer d\'avis plus tard.')}</div>`,'Continuer'),

// 3 Dialogues
()=>shell(2,`${Q('Avez-vous déjà les répliques ?','Avec vos vraies répliques, vous écouterez les voix sur votre propre texte.')}
<div class="drop" style="max-width:760px;padding:28px"><div class="big">⇣</div><b style="color:var(--t);font-size:14px">Déposez votre fichier ici</b><div>Texte, tableau, ou fichiers de langue du jeu</div><button class="btn sm" style="margin-top:6px">Choisir un fichier…</button></div>
<div class="box ok" style="max-width:760px;padding:16px"><div class="row"><b style="font-size:14px">✓ pointclick.json</b><span class="sp"></span><span class="sub">53 personnages · 237 répliques · français et anglais</span></div>
<div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap"><span class="tag">Le Majordome</span><span class="tag">La Reine Morgane</span><span class="tag">Le Lutin</span><span class="tag">Le Géant</span><span class="tag">Le Chat</span><span class="tag">… 48 autres</span></div></div>`,'Continuer','Pas encore de répliques'),

// 4 Voix
()=>shell(3,`${Q('Où fabriquer les voix ?','Nous avons choisi pour vous. Votre Mac (M5 Max, 64 Go) peut tout faire lui-même.')}
<div style="display:flex;flex-direction:column;gap:10px;max-width:780px">
${card(1,'💻','Sur ce Mac','Gratuit, sans Internet une fois installé. Recommandé.',`<div class="list" style="margin-top:12px">
${[['on','Voix naturelle','Polyvalente, rapide. La plus sûre.','Recommandée'],['on','Voix d\'acteur','La plus vivante et émouvante. Plus lente.',''],['','Voix rapide','Pour les Mac modestes.','']].map(v=>`<div class="li" style="padding:9px 12px"><span class="ck ${v[0]}">${v[0]?'✓':''}</span><div style="flex:1"><b>${v[1]}</b> <span class="sub">· ${v[2]}</span></div>${v[3]?`<span class="tag acc">${v[3]}</span>`:''}</div>`).join('')}
</div><div class="sub" style="margin-top:8px">Cochées : à comparer à l'étape suivante.</div>`)}
${card(0,'🖥️','Sur un autre ordinateur','Un PC ou un serveur de la maison qui fabrique déjà des voix.')}
${card(0,'☁️','Avec un service en ligne','ElevenLabs et autres : très bonne qualité, payant. Le prix est annoncé avant chaque génération.')}</div>`,'Écouter'),

// 5 Écoute
()=>{const L=['« Hé hé hé ! Vous croyiez m\'échapper ? »','« Qui ose entrer dans mon château ? »','« La Reine vous attend. »'];
return shell(4,`${Q('Laquelle préférez-vous ?','Les mêmes répliques de votre projet, dites par chaque voix.')}
<div class="g2" style="max-width:860px">${[['Voix naturelle','Rapide'],['Voix d\'acteur','Plus lente']].map((m,k)=>`<div class="box ${k?'sel':''}" style="padding:16px;display:flex;flex-direction:column;gap:10px"><div class="row"><b style="font-size:15px">${m[0]}</b><span class="sp"></span><span class="sub">${m[1]}</span></div>
${L.map((l,j)=>`<div class="row"><span class="play">${k&&j==1?'■':'▶'}</span><div style="flex:1"><div class="sub">${l}</div>${W(30)}</div></div>`).join('')}
<button class="btn ${k?'pri':''}" style="justify-content:center">${k?'✓ Je garde celle-ci':'Je garde celle-ci'}</button></div>`).join('')}</div>
<div class="row" style="max-width:860px"><span class="sub">Préparation des voix</span><div class="pbar" style="flex:1"><i style="width:100%"></i></div><span class="tag ok">Prêt</span></div>`,'Continuer')},

// 6 Créatures
()=>shell(5,`${Q('Et vos créatures ?','Votre projet a 9 personnages qui ne sont pas humains. Écoutez et choisissez un son pour chacun.')}
<div class="list" style="max-width:820px">${[['Le Géant','Très grave','Grondant','Caverneux'],['Le Dragon','Rugissant','Fumant','Ancien'],['Le Lutin','Aigu et rapide','Nasillard','Chuchoté'],['Le Chat','Miaulement','Ronronnement','Feulement']].map((c,k)=>`<div class="box" style="padding:12px 16px;display:flex;align-items:center;gap:14px"><b style="width:120px;font-size:14px">${c[0]}</b>${[1,2,3].map(j=>`<div class="row" style="flex:1;gap:8px;padding:6px 10px;border-radius:10px;${j==1?'outline:2px solid var(--acc)':''}"><span class="play">▶</span><span>${c[j]}</span></div>`).join('')}</div>`).join('')}</div>
<div class="sub">… et 5 autres. Vous pourrez changer chaque son plus tard dans le casting.</div>`,'Continuer','Passer'),

// 7 Bibliothèque
()=>shell(6,`${Q('Tout est prêt.','mCASTING va maintenant créer votre bibliothèque de voix : des centaines de voix différentes parmi lesquelles vous ferez votre casting.')}
<div class="box" style="max-width:640px;padding:20px;display:flex;flex-direction:column;gap:14px">
<div class="g3"><div><div class="big">600</div><div class="sub">voix</div></div><div><div class="big">≈ 3 h</div><div class="sub">sur ce Mac</div></div><div><div class="big">1,4 Go</div><div class="sub">sur le disque</div></div></div>
<div class="sub" style="font-size:12.5px">Vous pouvez commencer le casting dès les premières voix. Le Mac reste utilisable ; si vous l'éteignez, la création reprendra toute seule.</div></div>
<button class="btn sm ghost" style="align-self:flex-start">Options (nombre de voix, langues…)</button>`,'Créer ma bibliothèque')];

let cur=0,th='clair';const win=document.getElementById('win'),sc=document.getElementById('screens'),lg=document.getElementById('legend');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+s;b.onclick=()=>{cur=i;draw()};sc.append(b)});
function draw(){win.innerHTML=S[cur]();win.dataset.th=th;lg.textContent=LEG[cur];[...sc.children].forEach((b,i)=>b.classList.toggle('on',i==cur))}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{th=b.dataset.th;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x==b));draw()});
draw();
</script></body></html>
